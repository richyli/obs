<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課堂 · Excel &amp; Tableau Dashboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
body {
  font-family: "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
  background: #f0f2f5;
  margin: 0; min-height: 100vh; color: #1a1a1a;
}

/* ── Setup screen ─────────────────────────────── */
.setup-wrap {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 2rem;
}
.setup-card {
  background: #fff; border-radius: 14px; padding: 2.5rem;
  max-width: 520px; width: 100%;
  box-shadow: 0 4px 24px rgba(0,0,0,.1);
}
.setup-card h2 { margin: 0 0 .4rem; font-size: 1.25rem; }
.setup-card p  { color: #555; font-size: .88rem; line-height: 1.7; margin: 0 0 1.4rem; }
.setup-card input {
  width: 100%; padding: .7rem 1rem; border: 1.5px solid #ddd;
  border-radius: 8px; font-size: .95rem; margin-bottom: 1rem;
}
.setup-card input:focus { outline: none; border-color: #0055cc; }

/* ── Shared header ────────────────────────────── */
.hdr {
  background: #fff; padding: 1rem 1.8rem;
  border-bottom: 1px solid #e4e4e4;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 20;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}
.hdr h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
.hdr-sub { font-size: .8rem; color: #999; margin-top: .1rem; }
.hdr-left { display: flex; flex-direction: column; }
.hdr-right { display: flex; align-items: center; gap: .8rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.ok  { background: #22c55e; }
.dot.err { background: #ef4444; }
.conn-text { font-size: .75rem; color: #999; }
.session-chip {
  font-size: .72rem; font-weight: 700; letter-spacing: .03em;
  background: #e8f0ff; color: #0055cc;
  padding: .2rem .65rem; border-radius: 20px;
}

/* ── Unit list wrapper ────────────────────────── */
.unit-wrap {
  max-width: 720px; margin: 1.4rem auto;
  padding: 0 1.2rem;
  display: flex; flex-direction: column; gap: .5rem;
}

/* ── Section header ───────────────────────────── */
.section-hdr {
  display: flex; align-items: center; gap: .7rem;
  font-size: .72rem; font-weight: 800; letter-spacing: .1em;
  text-transform: uppercase; color: #666;
  padding: .9rem 0 .1rem; margin-top: .2rem;
}
.section-hdr::after {
  content: ""; flex: 1; height: 1px; background: #d8d8d8;
}

/* ── Unit card (grid) ─────────────────────────── */
.unit-card {
  background: #fff; border-radius: 10px;
  padding: .85rem 1.1rem;
  display: grid;
  grid-template-areas:
    "label action"
    "hint  action";
  grid-template-columns: 1fr auto;
  grid-template-rows: auto auto;
  column-gap: 1.1rem; row-gap: .2rem;
  box-shadow: 0 1px 4px rgba(0,0,0,.07);
  border-left: 4px solid transparent;
  transition: border-color .2s, background .2s;
}
.unit-card.active { border-left-color: #fbbf24; background: #fffbeb; }
.unit-card.done   { border-left-color: #22c55e; background: #f0fff4; }

.u-label {
  grid-area: label;
  font-size: .92rem; font-weight: 600;
  display: flex; align-items: center; gap: .45rem; flex-wrap: wrap;
}
.u-time {
  font-size: .7rem; color: #aaa; font-weight: 400;
  background: #f3f3f3; padding: .1rem .4rem; border-radius: 4px;
  flex-shrink: 0;
}
.u-hint {
  grid-area: hint;
  font-size: .8rem; color: #888; line-height: 1.4;
  padding-top: .05rem;
}
.unit-card.done .u-hint { color: #b0b0b0; }

/* ── Student: action area ─────────────────────── */
.u-btn-area {
  grid-area: action;
  display: flex; align-items: center; justify-content: flex-end;
}
.btn-done {
  padding: .42rem 1.05rem; border: none; border-radius: 7px;
  font-size: .85rem; font-weight: 700; cursor: pointer;
  white-space: nowrap; transition: all .15s;
  background: #0055cc; color: #fff;
}
.btn-done:hover:not(:disabled) { background: #0044aa; transform: scale(1.04); }
.btn-done.done   { background: #22c55e; cursor: default; }
.btn-done:disabled { background: #e0e0e0; color: #999; cursor: not-allowed; }
.active-badge {
  font-size: .7rem; font-weight: 700; letter-spacing: .04em;
  background: #fbbf24; color: #7c5a00;
  padding: .15rem .45rem; border-radius: 4px;
}

/* ── Teacher: action area ─────────────────────── */
.u-bar-area {
  grid-area: action;
  display: flex; flex-direction: column; align-items: flex-end;
  justify-content: center; gap: .28rem; min-width: 88px;
}
.u-count { font-size: .85rem; font-weight: 700; color: #0055cc; }
.bar-bg  { width: 100%; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; background: #22c55e; transition: width .4s ease; }
.bar-fill.low { background: #ef4444; }
.bar-fill.mid { background: #fbbf24; }
.unit-card[onclick] { cursor: pointer; }
.unit-card[onclick]:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }

/* ── Teacher controls bar ─────────────────────── */
.t-controls {
  background: #fff; border-radius: 10px;
  padding: .9rem 1.3rem; margin-bottom: .4rem;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  box-shadow: 0 1px 4px rgba(0,0,0,.07);
}
.t-controls label { font-size: .88rem; color: #555; white-space: nowrap; }
.num-input {
  width: 64px; padding: .35rem .5rem;
  border: 1.5px solid #ddd; border-radius: 6px;
  font-size: 1rem; font-weight: 700; text-align: center;
}
.btn-reset   { background: #ef4444; color: #fff; }
.btn-reset:hover { background: #cc0000; }
.btn-primary { background: #0055cc; color: #fff; }
.btn-primary:hover { background: #0044aa; }
.btn-reset, .btn-primary {
  padding: .42rem 1rem; border: none; border-radius: 7px;
  font-size: .88rem; font-weight: 700; cursor: pointer; transition: background .15s;
}

@media (max-width: 500px) {
  .hdr { padding: .85rem 1rem; }
  .unit-wrap { padding: 0 .7rem; margin: 1rem auto; }
  .u-hint { font-size: .75rem; }
  .btn-done { font-size: .8rem; padding: .38rem .8rem; }
  .u-bar-area { min-width: 72px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const FIREBASE_URL = "https://course-update-36460-default-rtdb.firebaseio.com";
const TEACHER_HASH = "a93ac600f27f6602bf628cd929c9028e285038fc8637fe1ec6792e8850ade6a8";
const POLL_MS = 2500;

// [id, label, time, hint] — null id = section header
const UNITS = [
  [null,   "前置準備"],
  ["e00a", "⓪-1 安裝 Excel",               "課前",   "需要 Excel 2016+（Mac 亦可）"],
  ["u00a", "⓪-2 安裝 Tableau Public",       "課前",   "tableau.com/products/public"],
  ["u00b", "⓪-3 下載 retail_monthly.csv",   "課前",   "課程頁面連結"],
  [null,   "Excel 部分"],
  ["e01",  "E① 匯入 CSV",                   "3 min",  "資料 → 從文字/CSV → 選取檔案"],
  ["e02",  "E② 建立樞紐分析表",               "8 min",  "插入 → 樞紐分析表，Country × Sales"],
  ["e03",  "E③ 樞紐分析圖（直條圖）",         "5 min",  "從 PivotTable 建立 PivotChart"],
  ["e04",  "E④ 樞紐分析圖（折線圖）",         "5 min",  "Month × Sales，觀察季節性"],
  ["e05",  "E⑤ 切片器（Slicer）",            "5 min",  "插入 → 切片器 → 選 Category"],
  ["e06",  "E⑥ 時間軸（Timeline）",          "3 min",  "插入 → 時間軸 → 選 Date"],
  ["e07",  "E⑦ 互動 Dashboard",              "5 min",  "切片器連結多個 PivotTable"],
  [null,   "Tableau 部分"],
  ["u01",  "T① 連結 CSV 資料",               "2 min",  "File → Connect → Text File"],
  ["u02",  "T② 確認欄位型別",                 "2 min",  "日期 / 數值 / 字串型別辨識"],
  ["u03",  "T③ 建立 Hierarchy",              "3 min",  "Category + Sub_Category → Product 層級"],
  ["u04",  "T④ 長條圖",                      "8 min",  "Columns / Rows 拖曳、Color encoding、排序"],
  ["u05",  "T⑤ Hierarchy drill-down",       "2 min",  "點 + 展開子品類"],
  ["u06",  "T⑥ 折線圖",                      "8 min",  "日期層級切換（年→月）、多條折線"],
  ["u07",  "T⑦ Reference Line",             "2 min",  "加入平均值參考線"],
  ["u08",  "T⑧ 地圖（Map）",                 "8 min",  "雙擊 Country、Filled Map、Color by Sales"],
  ["u09",  "T⑨ Tooltip 自訂",                "2 min",  "加入 Profit 至 Tooltip"],
  ["u10",  "T⑩ Small Multiples",            "8 min",  "Category 放 Rows、Month 放 Columns"],
  ["u11",  "T⑪ Sankey Chart",               "10 min", "Continent → Category → Sub_Category 流向"],
  [null,   "Dashboard 組合"],
  ["u12",  "D① 建立 Dashboard",              "5 min",  "拖入 5 個 Sheet、Container 排版"],
  ["u13",  "D② 加入篩選動作",                 "5 min",  "Dashboard Actions → Filter"],
  ["u14",  "D③ 全域篩選器",                   "2 min",  "Category Filter 套用到所有 Sheet"],
  ["u15",  "D④ 匯出 / 分享",                  "2 min",  "Export as Packaged Workbook (.twbx)"],
];

// ── State ─────────────────────────────────────────
const params        = new URLSearchParams(location.search);
const WANTS_TEACHER = params.has("t");
let   IS_TEACHER    = WANTS_TEACHER && sessionStorage.getItem("teacher_auth") === "1";
const LS_DB         = "cls_db_url";
const LS_LOCAL      = "cls_local";

let dbUrl     = (FIREBASE_URL || localStorage.getItem(LS_DB) || "").replace(/\/$/, "");
let connected = false;
let pollTimer = null;

let srv = { session: 0, total: 0, active: "" };
UNITS.forEach(([id]) => { if (id) srv[id] = 0; });

let local = JSON.parse(localStorage.getItem(LS_LOCAL) || '{"session":0,"done":{}}');

const root = document.getElementById("root");

// ── Firebase REST ──────────────────────────────────
const COURSE_ID = (function(){
  const stem = location.pathname.split('/').pop().replace(/\.html$/, '');
  if (['progress','classroom','lesson'].includes(stem)) return 'classroom';
  return stem.replace(/_(progress|classroom|lesson)$/, '');
})();
function dbPath() { return `${dbUrl}/${COURSE_ID}.json`; }
async function dbGet() {
  try {
    const r = await fetch(dbPath());
    if (!r.ok) throw new Error(r.status);
    connected = true; return await r.json();
  } catch { connected = false; return null; }
}
async function dbPatch(data) {
  return fetch(dbPath(), { method: "PATCH", body: JSON.stringify(data),
    headers: { "Content-Type": "application/json" } });
}
async function dbPut(data) {
  return fetch(dbPath(), { method: "PUT", body: JSON.stringify(data),
    headers: { "Content-Type": "application/json" } });
}

// ── Sync ──────────────────────────────────────────
async function poll() {
  const data = await dbGet();
  if (!data) { render(); return; }
  if ((data.session || 0) > (local.session || 0)) {
    local = { session: data.session, done: {} };
    localStorage.setItem(LS_LOCAL, JSON.stringify(local));
  }
  srv.session = data.session || 0;
  srv.total   = data.total   || 0;
  srv.active  = data.active  || "";
  UNITS.forEach(([id]) => { if (id) srv[id] = data[id] || 0; });
  render();
}

// ── Student action ────────────────────────────────
async function markDone(uid) {
  if (local.done[uid]) return;
  local.done[uid] = true;
  localStorage.setItem(LS_LOCAL, JSON.stringify(local));
  const next = (srv[uid] || 0) + 1;
  srv[uid] = next; render();
  await dbPatch({ [uid]: next });
}

// ── Teacher actions ───────────────────────────────
async function resetAll() {
  if (!confirm("確定重置所有學生進度？\n學生頁面將在 3 秒內自動更新。")) return;
  const newSession = (srv.session || 0) + 1;
  const fresh = { session: newSession, total: srv.total, active: srv.active };
  UNITS.forEach(([id]) => { if (id) fresh[id] = 0; });
  await dbPut(fresh); srv = { ...fresh }; render();
}
async function setTotal(n) {
  if (isNaN(n) || n < 1) return;
  srv.total = n; await dbPatch({ total: n }); render();
}
async function setActive(uid) {
  const next = srv.active === uid ? "" : uid;
  srv.active = next; render(); await dbPatch({ active: next });
}

// ── Setup screen ──────────────────────────────────
function renderSetup() {
  root.innerHTML = `
<div class="setup-wrap"><div class="setup-card">
  <h2>🔧 首次設定 Firebase</h2>
  <p>請輸入 Firebase Realtime Database URL。</p>
  <input id="db-in" type="url" placeholder="https://my-project-default-rtdb.firebaseio.com"
         value="${localStorage.getItem(LS_DB) || ""}">
  <button class="btn-primary" style="width:100%;padding:.7rem" onclick="saveDb()">儲存並開始</button>
</div></div>`;
}
function saveDb() {
  const val = document.getElementById("db-in").value.trim().replace(/\/$/, "");
  if (!val.startsWith("https://")) { alert("請輸入完整 HTTPS URL"); return; }
  dbUrl = val; localStorage.setItem(LS_DB, val); init();
}

// ── Teacher login ─────────────────────────────────
function renderTeacherLogin() {
  root.innerHTML = `
<div class="setup-wrap"><div class="setup-card">
  <h2>🔒 講師登入</h2>
  <p>請輸入講師密碼以進入課堂管理介面。</p>
  <input id="pw-in" type="password" placeholder="密碼"
         onkeydown="if(event.key==='Enter')checkTeacherPw()">
  <button class="btn-primary" style="width:100%;padding:.7rem" onclick="checkTeacherPw()">登入</button>
  <p id="pw-err" style="color:#ef4444;font-size:.85rem;margin:.6rem 0 0;display:none">密碼錯誤，請再試一次</p>
</div></div>`;
  setTimeout(() => document.getElementById("pw-in")?.focus(), 50);
}
async function checkTeacherPw() {
  const val = document.getElementById("pw-in")?.value || "";
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(val));
  const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  if (hex === TEACHER_HASH) {
    sessionStorage.setItem("teacher_auth","1"); IS_TEACHER = true; init();
  } else {
    document.getElementById("pw-err").style.display = "block";
    document.getElementById("pw-in").value = "";
    document.getElementById("pw-in").focus();
  }
}

// ── Connection indicator ──────────────────────────
function connHtml() {
  return `<span class="dot ${connected ? "ok" : "err"}"></span>
          <span class="conn-text">${connected ? "已連線" : "離線"}</span>`;
}

// ── Render: Student ───────────────────────────────
function renderStudent() {
  const inSession = local.session === srv.session;
  const items = UNITS.map(([uid, label, time, hint]) => {
    if (!uid) return `<div class="section-hdr">${label}</div>`;
    const isDone   = inSession && !!local.done[uid];
    const isActive = srv.active === uid;
    const cls      = isDone ? " done" : isActive ? " active" : "";
    const badge    = isActive && !isDone ? `<span class="active-badge">現在</span>` : "";
    return `
<div class="unit-card${cls}">
  <div class="u-label">
    ${label}${badge}
    ${time ? `<span class="u-time">${time}</span>` : ""}
  </div>
  <div class="u-btn-area">
    <button class="btn-done${isDone ? " done" : ""}"${isDone ? " disabled" : ""}
            onclick="${isDone ? "" : `markDone('${uid}')`}">
      ${isDone ? "✓ 完成" : "完成"}
    </button>
  </div>
  ${hint ? `<div class="u-hint">${hint}</div>` : ""}
</div>`;
  }).join("");

  root.innerHTML = `
<div class="hdr">
  <div class="hdr-left">
    <h1>Excel &amp; Tableau Dashboard</h1>
    <div class="hdr-sub">完成每個步驟後按「完成」</div>
  </div>
  <div class="hdr-right">${connHtml()}</div>
</div>
<div class="unit-wrap">${items}</div>`;
}

// ── Render: Teacher ───────────────────────────────
function renderTeacher() {
  const total = srv.total || 1;
  const items = UNITS.map(([uid, label, time, hint]) => {
    if (!uid) return `<div class="section-hdr">${label}</div>`;
    const cnt      = srv[uid] || 0;
    const pct      = Math.min(100, Math.round(cnt / total * 100));
    const fill     = pct >= 80 ? "" : pct >= 40 ? " mid" : " low";
    const isActive = srv.active === uid;
    return `
<div class="unit-card${isActive ? " active" : ""}" onclick="setActive('${uid}')">
  <div class="u-label">
    ${label}${isActive ? ' <span class="active-badge">現在進行</span>' : ""}
    ${time ? `<span class="u-time">${time}</span>` : ""}
  </div>
  <div class="u-bar-area">
    <span class="u-count">${cnt} / ${total}</span>
    <div class="bar-bg"><div class="bar-fill${fill}" style="width:${pct}%"></div></div>
  </div>
  ${hint ? `<div class="u-hint">${hint}</div>` : ""}
</div>`;
  }).join("");

  root.innerHTML = `
<div class="hdr">
  <div class="hdr-left">
    <h1>課堂進度（講師）</h1>
    <div class="hdr-sub">點擊單元以標記「現在進行」</div>
  </div>
  <div class="hdr-right">
    <span class="session-chip">Session ${srv.session}</span>
    ${connHtml()}
  </div>
</div>
<div class="unit-wrap">
  <div class="t-controls">
    <label>學生總人數：</label>
    <input class="num-input" type="number" min="1" max="300"
           value="${srv.total || ""}" placeholder="25"
           onchange="setTotal(parseInt(this.value))">
    <button class="btn-reset" onclick="resetAll()">🔄 重置進度</button>
    ${connHtml()}
  </div>
  ${items}
</div>`;
}

// ── Dispatcher ────────────────────────────────────
function render() {
  if (IS_TEACHER) renderTeacher();
  else renderStudent();
}

// ── Init ──────────────────────────────────────────
function init() {
  if (WANTS_TEACHER && !IS_TEACHER) { renderTeacherLogin(); return; }
  if (!dbUrl) { renderSetup(); return; }
  poll();
  clearInterval(pollTimer);
  pollTimer = setInterval(poll, POLL_MS);
}

init();
</script>
</body>
</html>
