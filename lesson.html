<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課堂講義 · Excel &amp; Tableau Dashboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
body {
  font-family: "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
  background: #f0f2f5; margin: 0; min-height: 100vh; color: #1a1a1a;
}

/* ── Setup / Login screens ────────────────────── */
.setup-wrap {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 2rem;
}
.setup-card {
  background: #fff; border-radius: 14px; padding: 2.5rem;
  max-width: 520px; width: 100%;
  box-shadow: 0 4px 24px rgba(0,0,0,.1);
}
.setup-card h2 { margin: 0 0 .4rem; font-size: 1.25rem; }
.setup-card p  { color: #555; font-size: .88rem; line-height: 1.7; margin: 0 0 1.4rem; }
.setup-card input {
  width: 100%; padding: .7rem 1rem; border: 1.5px solid #ddd;
  border-radius: 8px; font-size: .95rem; margin-bottom: 1rem;
}
.setup-card input:focus { outline: none; border-color: #0055cc; }

/* ── Sticky header ────────────────────────────── */
.hdr {
  background: #fff; padding: .85rem 1.8rem;
  border-bottom: 1px solid #e4e4e4;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 30;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}
.hdr-left { display: flex; flex-direction: column; }
.hdr h1 { margin: 0; font-size: 1rem; font-weight: 700; }
.hdr-sub { font-size: .75rem; color: #999; margin-top: .1rem; }
.hdr-right { display: flex; align-items: center; gap: .7rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.ok  { background: #22c55e; }
.dot.err { background: #ef4444; }
.conn-text { font-size: .75rem; color: #999; }
.session-chip {
  font-size: .72rem; font-weight: 700; letter-spacing: .03em;
  background: #e8f0ff; color: #0055cc;
  padding: .2rem .6rem; border-radius: 20px;
}

/* ── Active unit banner (below header) ────────── */
.now-banner {
  background: #fbbf24; color: #7c5a00;
  font-size: .8rem; font-weight: 700; letter-spacing: .03em;
  text-align: center; padding: .35rem 1rem;
  position: sticky; top: 57px; z-index: 29;
}

/* ── Lesson wrapper ───────────────────────────── */
.lesson-wrap {
  max-width: 780px; margin: 1.4rem auto 3rem;
  padding: 0 1.2rem;
  display: flex; flex-direction: column; gap: .8rem;
}

/* ── Section divider ──────────────────────────── */
.section-hdr {
  display: flex; align-items: center; gap: .7rem;
  font-size: .72rem; font-weight: 800; letter-spacing: .1em;
  text-transform: uppercase; color: #666;
  padding: .5rem 0 .1rem; margin-top: .6rem;
}
.section-hdr::after { content: ""; flex: 1; height: 1px; background: #d0d0d0; }

/* ── Teacher controls bar ─────────────────────── */
.t-controls {
  background: #fff; border-radius: 10px;
  padding: .85rem 1.2rem;
  display: flex; align-items: center; gap: .9rem; flex-wrap: wrap;
  box-shadow: 0 1px 4px rgba(0,0,0,.07);
}
.t-controls label { font-size: .87rem; color: #555; white-space: nowrap; }
.num-input {
  width: 60px; padding: .32rem .5rem;
  border: 1.5px solid #ddd; border-radius: 6px;
  font-size: 1rem; font-weight: 700; text-align: center;
}
.btn-reset   { background: #ef4444; color: #fff; }
.btn-reset:hover { background: #cc0000; }
.btn-primary { background: #0055cc; color: #fff; }
.btn-primary:hover { background: #0044aa; }
.btn-reset, .btn-primary {
  padding: .4rem .95rem; border: none; border-radius: 7px;
  font-size: .87rem; font-weight: 700; cursor: pointer; transition: background .15s;
}

/* ── Lesson card ──────────────────────────────── */
.lesson-card {
  background: #fff; border-radius: 10px; overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,.07);
  border-left: 4px solid transparent;
  transition: border-color .2s, background .2s;
}
.lesson-card.active { border-left-color: #fbbf24; }
.lesson-card.done   { border-left-color: #22c55e; }

/* Card header */
.card-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: .8rem 1.2rem; gap: .6rem;
  border-bottom: 1px solid #f0f0f0;
  background: #fafafa;
}
.lesson-card.active .card-hdr { background: #fffbeb; }
.lesson-card.done   .card-hdr { background: #f0fff4; }
.card-hdr-main { display: flex; align-items: center; gap: .5rem; flex: 1; flex-wrap: wrap; }
.card-label { font-size: .93rem; font-weight: 700; }
.u-time {
  font-size: .7rem; color: #aaa; font-weight: 400;
  background: #efefef; padding: .1rem .4rem; border-radius: 4px;
}
.active-badge {
  font-size: .7rem; font-weight: 700; letter-spacing: .04em;
  background: #fbbf24; color: #7c5a00;
  padding: .15rem .5rem; border-radius: 4px;
}
.done-badge {
  font-size: .7rem; font-weight: 700;
  background: #22c55e; color: #fff;
  padding: .15rem .5rem; border-radius: 4px;
}

/* Card body (lesson content) */
.card-body {
  padding: .7rem 1.2rem .5rem;
  transition: opacity .3s;
}
.lesson-card.done .card-body { opacity: .45; }

.card-body p  { font-size: .87rem; line-height: 1.65; color: #333; margin: .4rem 0; }
.card-body h4 { font-size: .83rem; font-weight: 700; color: #444; margin: .8rem 0 .3rem; }
.card-body ol, .card-body ul { margin: .4rem 0 .4rem 1.25rem; }
.card-body > ul { list-style: disc; }
.card-body > ol { list-style: decimal; }
.card-body li ul { list-style: circle; margin-top: .2rem; }
.card-body li { font-size: .87rem; line-height: 1.6; color: #333; margin-bottom: .28rem; }
.card-body code {
  background: #f3f3f3; color: #c7254e;
  padding: .1em .35em; border-radius: 3px;
  font-size: .83em; font-family: "SFMono-Regular", Consolas, monospace;
}
.card-body strong { color: #111; }
.card-body a { color: #0055cc; }

.note {
  background: #f0f7ff; border-left: 3px solid #0055cc;
  padding: .5rem .85rem; border-radius: 0 6px 6px 0;
  margin: .55rem 0; font-size: .84rem; line-height: 1.55; color: #333;
}
.question {
  background: #fff8e6; border-left: 3px solid #f59e0b;
  padding: .5rem .85rem; border-radius: 0 6px 6px 0;
  margin: .55rem 0; font-size: .84rem; line-height: 1.55; color: #333;
}

/* Card footer */
.card-foot {
  display: flex; align-items: center; justify-content: flex-end;
  padding: .65rem 1.2rem; border-top: 1px solid #f0f0f0; gap: .6rem;
}
.card-foot.t-foot { flex-direction: column; align-items: stretch; gap: .28rem; }
.t-foot-top {
  display: flex; justify-content: space-between; align-items: center;
}
.t-hint-text { font-size: .72rem; color: #ccc; }
.u-count { font-size: .85rem; font-weight: 700; color: #0055cc; }
.bar-bg  { width: 100%; height: 7px; background: #eee; border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; background: #22c55e; transition: width .4s ease; }
.bar-fill.low { background: #ef4444; }
.bar-fill.mid { background: #fbbf24; }

/* Done / complete button */
.btn-done {
  padding: .42rem 1.1rem; border: none; border-radius: 7px;
  font-size: .87rem; font-weight: 700; cursor: pointer;
  white-space: nowrap; transition: all .15s;
  background: #0055cc; color: #fff;
}
.btn-done:hover:not(:disabled) { background: #0044aa; transform: scale(1.03); }
.btn-done.done   { background: #22c55e; cursor: default; }
.btn-done:disabled { background: #e0e0e0; color: #999; cursor: not-allowed; }

/* Teacher card: clickable header */
.card-hdr.t-clickable { cursor: pointer; }
.card-hdr.t-clickable:hover { filter: brightness(.97); }

@media (max-width: 520px) {
  .hdr { padding: .8rem 1rem; }
  .lesson-wrap { padding: 0 .7rem; margin-top: 1rem; }
  .card-hdr { padding: .7rem 1rem; }
  .card-body { padding: .6rem 1rem .4rem; }
  .card-foot { padding: .55rem 1rem; }
  .card-body li, .card-body p { font-size: .83rem; }
}
</style>
</head>

// UNITS: [id, label, time] — null id = section header
const UNITS = [
  [null,   "前置準備"],
  ["e00a", "⓪-1 安裝 Excel",               "課前"],
  ["u00a", "⓪-2 安裝 Tableau Public",       "課前"],
  ["u00b", "⓪-3 下載 retail_monthly.csv",   "課前"],
  [null,   "Excel 部分"],
  ["e01",  "E① 匯入 CSV",                   "3 min"],
  ["e02",  "E② 建立樞紐分析表",               "8 min"],
  ["e03",  "E③ 樞紐分析圖（直條圖）",         "5 min"],
  ["e04",  "E④ 樞紐分析圖（折線圖）",         "5 min"],
  ["e05",  "E⑤ 切片器（Slicer）",            "5 min"],
  ["e06",  "E⑥ 時間軸（Timeline）",          "3 min"],
  ["e07",  "E⑦ 互動 Dashboard",              "5 min"],
  [null,   "Tableau 部分"],
  ["u01",  "T① 連結 CSV 資料",               "2 min"],
  ["u02",  "T② 確認欄位型別",                 "2 min"],
  ["u03",  "T③ 建立 Hierarchy",              "3 min"],
  ["u04",  "T④ 長條圖",                      "8 min"],
  ["u05",  "T⑤ Hierarchy drill-down",       "2 min"],
  ["u06",  "T⑥ 折線圖",                      "8 min"],
  ["u07",  "T⑦ Reference Line",             "2 min"],
  ["u08",  "T⑧ 地圖（Map）",                 "8 min"],
  ["u09",  "T⑨ Tooltip 自訂",                "2 min"],
  ["u10",  "T⑩ Small Multiples",            "8 min"],
  ["u11",  "T⑪ Sankey Chart",               "10 min"],
  [null,   "Dashboard 組合"],
  ["u12",  "D① 建立 Dashboard",              "5 min"],
  ["u13",  "D② 加入篩選動作",                 "5 min"],
  ["u14",  "D③ 全域篩選器",                   "2 min"],
  ["u15",  "D④ 匯出 / 分享",                  "2 min"],
];

// ── State ─────────────────────────────────────────
const params        = new URLSearchParams(location.search);
const WANTS_TEACHER = params.has("t");
let   IS_TEACHER    = WANTS_TEACHER && sessionStorage.getItem("teacher_auth") === "1";
const LS_DB         = "cls_db_url";
const LS_LOCAL      = "cls_local";

let dbUrl     = (FIREBASE_URL || localStorage.getItem(LS_DB) || "").replace(/\/$/, "");
let connected = false;
let pollTimer = null;

let srv = { session: 0, total: 0, active: "" };
UNITS.forEach(([id]) => { if (id) srv[id] = 0; });

let local = JSON.parse(localStorage.getItem(LS_LOCAL) || '{"session":0,"done":{}}');

const root = document.getElementById("root");

// ── Firebase REST ──────────────────────────────────
function dbPath() { return `${dbUrl}/classroom.json`; }
async function dbGet() {
  try {
    const r = await fetch(dbPath());
    if (!r.ok) throw new Error(r.status);
    connected = true; return await r.json();
  } catch { connected = false; return null; }
}
async function dbPatch(data) {
  return fetch(dbPath(), { method: "PATCH", body: JSON.stringify(data),
    headers: { "Content-Type": "application/json" } });
}
async function dbPut(data) {
  return fetch(dbPath(), { method: "PUT", body: JSON.stringify(data),
    headers: { "Content-Type": "application/json" } });
}

// ── Sync ──────────────────────────────────────────
async function poll() {
  const data = await dbGet();
  if (!data) { render(); return; }
  if ((data.session || 0) > (local.session || 0)) {
    local = { session: data.session, done: {} };
    localStorage.setItem(LS_LOCAL, JSON.stringify(local));
  }
  srv.session = data.session || 0;
  srv.total   = data.total   || 0;
  srv.active  = data.active  || "";
  UNITS.forEach(([id]) => { if (id) srv[id] = data[id] || 0; });
  render();
}

// ── Student action ────────────────────────────────
async function markDone(uid) {
  if (local.done[uid]) return;
  local.done[uid] = true;
  localStorage.setItem(LS_LOCAL, JSON.stringify(local));
  const next = (srv[uid] || 0) + 1;
  srv[uid] = next; render();
  await dbPatch({ [uid]: next });
}

// ── Teacher actions ───────────────────────────────
async function resetAll() {
  if (!confirm("確定重置所有學生進度？\n學生頁面將在 3 秒內自動更新。")) return;
  const newSession = (srv.session || 0) + 1;
  const fresh = { session: newSession, total: srv.total, active: srv.active };
  UNITS.forEach(([id]) => { if (id) fresh[id] = 0; });
  await dbPut(fresh); srv = { ...fresh }; render();
}
async function setTotal(n) {
  if (isNaN(n) || n < 1) return;
  srv.total = n; await dbPatch({ total: n }); render();
}
async function setActive(uid) {
  const next = srv.active === uid ? "" : uid;
  srv.active = next; render(); await dbPatch({ active: next });
}

// ── Login screens ─────────────────────────────────
function renderSetup() {
  root.innerHTML = `
<div class="setup-wrap"><div class="setup-card">
  <h2>🔧 首次設定 Firebase</h2>
  <p>請輸入 Firebase Realtime Database URL。</p>
  <input id="db-in" type="url" placeholder="https://my-project-default-rtdb.firebaseio.com"
         value="${localStorage.getItem(LS_DB) || ""}">
  <button class="btn-primary" style="width:100%;padding:.7rem" onclick="saveDb()">儲存並開始</button>
</div></div>`;
}
function saveDb() {
  const val = document.getElementById("db-in").value.trim().replace(/\/$/, "");
  if (!val.startsWith("https://")) { alert("請輸入完整 HTTPS URL"); return; }
  dbUrl = val; localStorage.setItem(LS_DB, val); init();
}
function renderTeacherLogin() {
  root.innerHTML = `
<div class="setup-wrap"><div class="setup-card">
  <h2>🔒 講師登入</h2>
  <p>請輸入講師密碼以進入課堂管理介面。</p>
  <input id="pw-in" type="password" placeholder="密碼"
         onkeydown="if(event.key==='Enter')checkTeacherPw()">
  <button class="btn-primary" style="width:100%;padding:.7rem" onclick="checkTeacherPw()">登入</button>
  <p id="pw-err" style="color:#ef4444;font-size:.85rem;margin:.6rem 0 0;display:none">密碼錯誤，請再試一次</p>
</div></div>`;
  setTimeout(() => document.getElementById("pw-in")?.focus(), 50);
}
async function checkTeacherPw() {
  const val = document.getElementById("pw-in")?.value || "";
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(val));
  const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  if (hex === TEACHER_HASH) {
    sessionStorage.setItem("teacher_auth","1"); IS_TEACHER = true; init();
  } else {
    document.getElementById("pw-err").style.display = "block";
    document.getElementById("pw-in").value = "";
    document.getElementById("pw-in").focus();
  }
}

// ── Connection indicator ──────────────────────────
function connHtml() {
  return `<span class="dot ${connected ? "ok" : "err"}"></span>
          <span class="conn-text">${connected ? "已連線" : "離線"}</span>`;
}

// ── Build one card's HTML ─────────────────────────
function buildCard(uid, label, time) {
  const content  = CONTENT[uid] || "";
  const inSession = local.session === srv.session;

  if (IS_TEACHER) {
    const total    = srv.total || 1;
    const cnt      = srv[uid] || 0;
    const pct      = Math.min(100, Math.round(cnt / total * 100));
    const fill     = pct >= 80 ? "" : pct >= 40 ? " mid" : " low";
    const isActive = srv.active === uid;
    const badge    = isActive ? `<span class="active-badge">現在進行</span>` : "";

    return `
<div class="lesson-card${isActive ? " active" : ""}">
  <div class="card-hdr t-clickable" onclick="setActive('${uid}')">
    <div class="card-hdr-main">
      <span class="card-label">${label}</span>
      ${time ? `<span class="u-time">${time}</span>` : ""}
    </div>
    ${badge}
  </div>
  ${content ? `<div class="card-body">${content}</div>` : ""}
  <div class="card-foot t-foot">
    <div class="t-foot-top">
      <span class="t-hint-text">點擊標題以標記「現在進行」</span>
      <span class="u-count">${cnt} / ${total}</span>
    </div>
    <div class="bar-bg"><div class="bar-fill${fill}" style="width:${pct}%"></div></div>
  </div>
</div>`;
  } else {
    const isDone   = inSession && !!local.done[uid];
    const isActive = srv.active === uid;
    const cls      = isDone ? " done" : isActive ? " active" : "";
    const badge    = isActive && !isDone ? `<span class="active-badge">現在</span>`
                   : isDone              ? `<span class="done-badge">✓ 完成</span>`
                   :                       "";
    return `
<div class="lesson-card${cls}">
  <div class="card-hdr">
    <div class="card-hdr-main">
      <span class="card-label">${label}</span>
      ${time ? `<span class="u-time">${time}</span>` : ""}
    </div>
    ${badge}
  </div>
  ${content ? `<div class="card-body">${content}</div>` : ""}
  <div class="card-foot">
    <button class="btn-done${isDone ? " done" : ""}"${isDone ? " disabled" : ""}
            onclick="${isDone ? "" : `markDone('${uid}')`}">
      ${isDone ? "✓ 完成" : "完成"}
    </button>
  </div>
</div>`;
  }
}

// ── Render ────────────────────────────────────────
function render() {
  const scrollY = window.scrollY;

  const activeUnit = UNITS.find(([id]) => id && id === srv.active);
  const nowBanner  = activeUnit
    ? `<div class="now-banner">現在：${activeUnit[1]}</div>`
    : "";

  const items = UNITS.map(([uid, label, time]) => {
    if (!uid) return `<div class="section-hdr">${label}</div>`;
    return buildCard(uid, label, time);
  }).join("");

  const header = IS_TEACHER ? `
<div class="hdr">
  <div class="hdr-left">
    <h1>課堂進度（講師）</h1>
    <div class="hdr-sub">點擊各段落標題以標記「現在進行」</div>
  </div>
  <div class="hdr-right">
    <span class="session-chip">Session ${srv.session}</span>
    ${connHtml()}
  </div>
</div>
${nowBanner}` : `
<div class="hdr">
  <div class="hdr-left">
    <h1>Excel &amp; Tableau Dashboard</h1>
    <div class="hdr-sub">依照步驟操作，完成後按「完成」</div>
  </div>
  <div class="hdr-right">${connHtml()}</div>
</div>
${nowBanner}`;

  const controls = IS_TEACHER ? `
<div class="t-controls">
  <label>學生總人數：</label>
  <input class="num-input" type="number" min="1" max="300"
         value="${srv.total || ""}" placeholder="25"
         onchange="setTotal(parseInt(this.value))">
  <button class="btn-reset" onclick="resetAll()">🔄 重置進度</button>
  ${connHtml()}
</div>` : "";

  root.innerHTML = `${header}<div class="lesson-wrap">${controls}${items}</div>`;
  requestAnimationFrame(() => window.scrollTo(0, scrollY));
}

// ── Init ──────────────────────────────────────────
function init() {
  if (WANTS_TEACHER && !IS_TEACHER) { renderTeacherLogin(); return; }
  if (!dbUrl) { renderSetup(); return; }
  poll();
  clearInterval(pollTimer);
  pollTimer = setInterval(poll, POLL_MS);
}

init();
</script>
