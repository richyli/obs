<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Published Notes</title>
<style>*, *::before, *::after { box-sizing: border-box; }
body {
  font-family: "Helvetica Neue", Arial, "Noto Sans TC", "Microsoft JhengHei",
               sans-serif;
  font-size: 20px;
  line-height: 1.9;
  color: #111;
  background: #fff;
  margin: 0;
  padding: 3rem 1.5rem 5rem;
}
.container { max-width: 800px; margin: 0 auto; }
h1 {
  font-size: 1.75rem;
  font-weight: 700;
  margin: 0 0 0.15rem;
  padding-bottom: 0.4rem;
  border-bottom: 2px solid #111;
  line-height: 1.3;
}
h2 {
  font-size: 1.3rem;
  font-weight: 700;
  margin: 2.5rem 0 0.5rem;
  padding-bottom: 0.2rem;
  border-bottom: 1px solid #ddd;
}
h3 { font-size: 1.1rem; font-weight: 700; margin: 1.8rem 0 0.4rem; }
h4 { font-size: 1rem; font-weight: 700; margin: 1.4rem 0 0.3rem; }
p { margin: 0.9rem 0; }
a { color: #0055cc; text-decoration: none; }
a:hover { text-decoration: underline; }
nav { margin-bottom: 2.5rem; font-size: 0.85rem; color: #999; }
nav a { color: #999; }
code {
  font-family: "SFMono-Regular", Consolas, monospace;
  background: #f2f2f2;
  padding: 0.1em 0.4em;
  border-radius: 3px;
  font-size: 0.85em;
}
pre {
  background: #f2f2f2;
  padding: 1.2rem 1.4rem;
  border-radius: 5px;
  overflow-x: auto;
  font-size: 0.85em;
  line-height: 1.6;
}
pre code { background: none; padding: 0; }
ul, ol { padding-left: 1.6rem; margin: 0.8rem 0; }
li { margin: 0.35rem 0; }
li > ul, li > ol { margin: 0.2rem 0; }
blockquote {
  border-left: 4px solid #ccc;
  margin: 1.2rem 0;
  padding: 0.3rem 1.2rem;
  color: #444;
  background: #fafafa;
}
table { border-collapse: collapse; width: 100%; margin: 1.2rem 0; font-size: 0.95em; }
th, td { border: 1px solid #ccc; padding: 0.55rem 0.9rem; text-align: left; }
th { background: #f5f5f5; font-weight: 700; }
tr:nth-child(even) { background: #fafafa; }
hr { border: none; border-top: 1px solid #e0e0e0; margin: 2.5rem 0; }
.meta { font-size: 0.8rem; color: #aaa; margin: 0.3rem 0 1.8rem; }
.index-list { list-style: none; padding: 0; margin: 1rem 0; }
.index-list li {
  padding: 0.55rem 0;
  border-bottom: 1px solid #eee;
  font-size: 1.05rem;
}
.index-list li:last-child { border-bottom: none; }
</style>
</head>
<body>
<div class="container">
<nav></nav>
<h1>Notes</h1>
<p class="meta">1 篇</p>
<ul class="index-list">
  <li><a href="Claude_Code.html">Claude Code</a></li>
</ul>
</div>
</body>
</html>
